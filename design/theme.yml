# Theme settings for the whole site (Designer level).
# Colors, fonts and the logo live here, so they can change without touching page code.
# Each color becomes a CSS variable, for example blue-500 becomes var(--blue-500).
# Navy is blue-500 and gold is gold-500.
colors:
  gold-50: "#FDF8EF"
  gold-100: "#F9EDCF"
  gold-200: "#F0D48E"
  gold-300: "#E4B94E"
  gold-400: "#D4A024"
  gold-500: "#B8891E"
  gold-600: "#9A7019"
  gold-700: "#7A5814"
  gold-800: "#5C420F"
  blue-50: "#EEF2F7"
  blue-100: "#D5DEEB"
  blue-200: "#A8BAD4"
  blue-300: "#7B96BD"
  blue-400: "#4E72A6"
  blue-500: "#1E3A5F"
  blue-600: "#1A3253"
  blue-700: "#152947"
  blue-800: "#0F1F36"
  blue-900: "#0A1524"
  warm-50: "#FAFAF8"
  warm-100: "#F5F4F0"
  warm-200: "#E8E6E1"
  warm-300: "#D4D1CA"
  warm-400: "#B5B1A8"
  warm-500: "#8E897E"
  warm-600: "#6B665C"
  warm-700: "#4A4640"
  warm-800: "#2D2B27"
  warm-900: "#1A1917"
  green-400: "#5A8C5A"
  green-500: "#3D6B3D"
  terra-500: "#A85A38"
  alert-bg: "#FFF5F2"
  alert-border: "#D64545"
  alert-text: "#9B1C1C"
fonts:
  # Headings
  display: "'Cormorant Garamond', Georgia, serif"
  # Body text
  body: "'Source Sans 3', 'Segoe UI', sans-serif"
  # Web font files loaded from Google Fonts
  stylesheet: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
layout:
  max-width: "1200px"
  radius-sm: "4px"
  radius-md: "8px"
  radius-lg: "12px"
  ease-out: "cubic-bezier(0.16, 1, 0.3, 1)"
logo:
  # The parish crest in the menu, one image per language
  pt: images/crest-pt.jpg
  en: images/crest-en.jpg
  alt:
    pt: "Nossa Senhora Aparecida - Diocese de Bridgeport · Bethel, CT"
    en: "Our Lady of Aparecida - Diocese of Bridgeport · Bethel, CT"
