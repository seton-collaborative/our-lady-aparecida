    en: The Story of Our Community
  a_community_that_began_small:
    pt: Uma comunidade que começou pequena, cresceu em fé, e hoje serve mais de 1.100 famílias católicas brasileiras-americanas no sudoeste de Connecticut.
    en: A community that began small, grew in faith, and today serves more than 1,100 Brazilian-American Catholic families across southwestern Connecticut.
  the_brazilian_american_catholic_community:
    pt: |-
      <p>A Comunidade Católica Brasileira-Americana Nossa Senhora Aparecida tem mais de <strong>1.100 famílias cadastradas oficialmente</strong>, e muitas outras famílias e indivíduos ainda não cadastrados, mas que ajudam a povoar muitos eventos religiosos, sociais e culturais excepcionalmente bem frequentados. Tem muitas crianças, adolescentes e jovens, e a maioria dos adultos tem menos de 45 anos.</p>
                <p>A comunidade é sustentável, solvente e próspera, cumpre suas obrigações e cumpre suas responsabilidades; tem os talentos humanos de que necessita, ansiosos por servir.</p>
                <p>Há mais de <strong>27 anos</strong> Nossa Senhora Aparecida se mantém estável como comunidade católica de fé e amor, com muitos fiéis em movimentos, serviços, ministérios pastorais e/ou de outra forma dedicados ao serviço do Senhor. Nossa Senhora Aparecida se esforça para atender às necessidades sacramentais dos membros, forma, encoraja, apóia, sustenta e renova <strong>28 ministérios pastorais</strong> e grupos de serviço vibrantes, promove o desenvolvimento da fé, reuniões sociais, retiros, estudos bíblicos e desenvolvimento de liderança leiga.</p>
                <p>Desde a sua criação em <strong>25 de janeiro de 2020</strong>, a Quasi-Paróquia Nossa Senhora Aparecida pode celebrar missas diárias e dominicais em horários estratégicos, pois agora conta com o total apoio do nosso Bispo <strong>Frank J. Caggiano</strong>. A Paróquia Nossa Senhora Aparecida também adquiriu uma nova unidade localizada na <strong>42 Vail Rd, Bethel, CT 06801</strong> para resolver seu problema de espaço suficiente e adequado.</p>
                <p>Por mais de <strong>17 anos</strong>, Nossa Senhora Aparecida fez parte da Paróquia São Pedro, contando com o espaço físico da Igreja São Pedro desde a sua criação. Na época e atualmente, a paróquia celebra duas missas de fim de semana na Igreja de São Pedro: sábado e domingo à noite às 19h30.</p>
                <p>A Campanha da Capital Diocesana possibilitou a transferência do antigo Centro Comunitário Brasileiro (na Liberty Street, 61, em Danbury) para uma Paróquia instituída, junto com a aquisição e reaproveitamento do novo imóvel em Bethel. Nossa Senhora Aparecida está totalmente encarregada de direcionar o reaproveitamento do antigo salão de recepção de Michael's At The Grove em um novo espaço de culto, escritórios e salas de aula.</p>
                <p>A Paróquia Nossa Senhora Aparecida agradece imensamente a Paróquia São Pedro pela ajuda nesses 20 anos de parceria e trabalho em prol da pregação do Evangelho e da Salvação das Almas.</p>
    en: |-
      <p>The Brazilian-American Catholic Community of Our Lady of Aparecida has over <strong>1,100 officially registered families</strong>, plus many more families and individuals who are not yet registered but help fill our exceptionally well-attended religious, social, and cultural events. The community has many children, adolescents, and young adults, with most of its adults under 45 years old.</p>
                <p>The community is sustainable, solvent, and thriving - fulfilling its obligations and responsibilities, with abundant human talent eager to serve.</p>
                <p>For more than <strong>27 years</strong>, Our Lady of Aparecida has remained stable as a Catholic community of faith and love, with many faithful active in movements, services, and pastoral ministries. The parish works to meet the sacramental needs of its members and forms, encourages, supports, and renews <strong>28 vibrant pastoral ministries</strong> and service groups. It promotes faith development, social gatherings, retreats, Bible studies, and lay leadership formation.</p>
                <p>Since its creation on <strong>January 25, 2020</strong>, the Quasi-Parish of Our Lady of Aparecida has been able to celebrate daily and Sunday Masses at strategic times, thanks to the full support of our Bishop, <strong>Frank J. Caggiano</strong>. The parish also acquired a new property at <strong>42 Vail Road, Bethel, CT 06801</strong> to resolve its need for adequate space for worship, fellowship, and ministry.</p>
                <p>For more than <strong>17 years</strong>, Our Lady of Aparecida was part of St. Peter Parish, relying on the physical space of St. Peter Church since its founding. Then and now, the parish celebrates two weekend Masses at St. Peter Church: Saturday and Sunday evening at 7:30 PM.</p>
                <p>The Diocesan Capital Campaign made it possible to transfer the former Brazilian Community Center (at 61 Liberty Street, Danbury) to an established parish, together with the acquisition and repurposing of the new Bethel property. Our Lady of Aparecida is fully responsible for directing the transformation of the former Michael's At The Grove reception hall into a new space for worship, offices, and classrooms.</p>
                <p>Our Lady of Aparecida Parish is deeply grateful to St. Peter Parish for 20 years of partnership in preaching the Gospel and in the salvation of souls.</p>
