meta:
  title: Our Lady of Aparecida Parish | Paróquia Nossa Senhora Aparecida - Bethel, CT
  description: The first official Brazilian parish in the US named after Brazil's patron saint. A Catholic Community of Faith in the Diocese of Bridgeport.
hero:
  diocese_of_bridgeport_bethel_connecticut: Diocese of Bridgeport · Bethel, Connecticut
  our_lady_of_the_immaculate:
    pt: Nossa Senhora da Imaculada Conceição Aparecida
    en: Our Lady of the Immaculate Conception of Aparecida
  the_first_official_brazilian_parish:
    pt: A primeira paróquia brasileira oficial nos Estados Unidos em homenagem à padroeira do Brasil. Uma comunidade de fé vibrante com mais de 1.100 famílias registradas.
    en: The first official Brazilian parish in the United States named after Brazil's patron saint. A vibrant community of faith with over 1,100 registered families.
  mass_times:
    pt: Horário das Missas
    en: Mass Times
  about_our_parish:
    pt: Conheça a Paróquia
    en: About Our Parish
our_lady_of_aparecida_patroness:
  our_patroness:
    pt: Nossa Padroeira
    en: Our Patroness
  our_lady_of_aparecida:
    pt: Nossa Senhora Aparecida
    en: Our Lady of Aparecida
  our_lady_of_aparecida_is:
    pt: Nossa Senhora Aparecida é a Padroeira do Brasil. Em 1717, pescadores retiraram do Rio Paraíba uma pequena imagem escura da Imaculada Conceição, e a devoção a ela só cresceu desde então. Como a primeira paróquia oficialmente brasileira nos Estados Unidos, trazemos essa devoção para Bethel.
    en: Our Lady of Aparecida is the Patroness of Brazil. In 1717, fishermen on the Paraíba River drew a small dark statue of the Immaculate Conception from the water, and devotion to her has grown ever since. As the first official Brazilian parish in the United States, we carry that devotion home to Bethel.
