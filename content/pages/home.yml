about_welcome:
  about_our_parish:
    pt: Sobre a Paróquia
    en: About Our Parish
  a_community_of_faith_and:
    pt: Uma Comunidade de Fé e Esperança
    en: A Community of Faith and Hope
  for_more_than_27_years:
    pt: Por mais de 27 anos, Nossa Senhora Aparecida tem sido uma comunidade católica brasileira-americana de fé. Estabelecida como paróquia independente em 2020 após quase duas décadas como quase-paróquia sob São Pedro, a comunidade se expandiu para um novo local em Bethel, permitindo maior alcance pastoral e formação religiosa.
    en: For more than 27 years, Our Lady of Aparecida has been a Brazilian-American Catholic community of faith. Established as an independent parish in 2020 after nearly two decades as a quasi-parish under St. Peter's, the community has expanded to a new location in Bethel, allowing for greater pastoral outreach and religious formation.
  under_the_leadership_of_fr:
    pt: Sob a liderança do Pe. Leonel Medeiros, Vigário Episcopal para Católicos Brasileiros, a paróquia promove o desenvolvimento da fé por meio de 28 ministérios ativos, retiros, preparação sacramental e programas para jovens.
    en: Under the leadership of Fr. Leonel Medeiros, Episcopal Vicar for Brazilian Catholics, the parish fosters faith development through 28 active ministries, retreats, sacramental preparation, and youth programs.
